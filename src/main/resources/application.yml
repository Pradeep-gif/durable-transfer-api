spring:
  application:
    name: transaction-api-demo
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/transfers}
    username: ${DATABASE_USER:transfer}
    password: ${DATABASE_PASSWORD:transfer}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  temporal:
    target: ${TEMPORAL_TARGET:localhost:7233}
    task-queue: ${TEMPORAL_TASK_QUEUE:transfer-queue}
