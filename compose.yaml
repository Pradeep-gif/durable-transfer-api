services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: transfer
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer -d transfers"]
      interval: 5s
      timeout: 3s
      retries: 10
  temporal:
    image: temporalio/temporal:1.25.2
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/var/lib/temporal/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/transfers
      DATABASE_USER: transfer
      DATABASE_PASSWORD: transfer
      TEMPORAL_TARGET: temporal:7233
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
