apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-api-demo
  template:
    metadata:
      labels:
        app: transaction-api-demo
    spec:
      containers:
        - name: app
          image: transaction-api-demo:local
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: transaction-api-demo
                  key: database-url
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: transaction-api-demo
                  key: database-user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-api-demo
                  key: database-password
            - name: TEMPORAL_TARGET
              value: temporal-frontend:7233
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
